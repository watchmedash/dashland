# Build the game on every push to main and publish it, so a change can be
# played from a link rather than only by cloning and running a dev server.
#
# `dist/` is gitignored on purpose - the repo carries source - which meant the
# only way to see a fix was to build it yourself. This closes that.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-deployed build is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `build:web`, not `build`. The `build` script ends by running
      # scripts/build-apk.mjs, which hunts for Android Studio's bundled JDK at a
      # Windows path and calls process.exit(1) when it cannot find one - so this
      # job has been failing on every push since the APK step was added to that
      # script, and the site has been stale for as long. The APK is built and
      # published by apk.yml next door, which is the right place for it.
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
